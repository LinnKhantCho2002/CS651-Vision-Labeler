runtime: nodejs24
service: vision-labeler
instance_class: F1
entrypoint: npm start

automatic_scaling:
  min_instances: 0
  max_instances: 1
  max_concurrent_requests: 10

env_variables:
  NODE_ENV: production
  DEMO_MODE: "false"
  MAX_REQUESTS_PER_WINDOW: "20"
  RATE_WINDOW_MS: "600000"
  MAX_CONCURRENT_ANALYSES: "1"

handlers:
  - url: /.*
    script: auto
    secure: always
